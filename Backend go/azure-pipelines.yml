trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  GO_VERSION: "1.25.4"
  OUTPUT_NAME: "komercio-api"
  DEPLOY_PATH: "/home/azureuser/komercio/app"

stages:
- stage: Build
  displayName: Build Go API
  jobs:
  - job: BuildJob
    displayName: Compilar backend Go
    steps:
    - task: GoTool@0
      inputs:
        version: $(GO_VERSION)

    - script: |
        echo "Compilando API Go..."
        cd Backend_go/cmd
        go mod tidy
        go build -o $(OUTPUT_NAME) main.go
      displayName: Build Go

    - task: PublishPipelineArtifact@1
      displayName: Publicar binário
      inputs:
        targetPath: Backend_go/cmd/$(OUTPUT_NAME)
        artifact: drop

- stage: Deploy
  displayName: Deploy Main
  dependsOn: Build
  jobs:
  - job: DeployJob
    displayName: Deploy na VM
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: Download artifact
      inputs:
        artifactName: drop
        targetPath: $(Pipeline.Workspace)/drop

    - task: SSH@0
      displayName: Parar serviço
      inputs:
        sshEndpoint: Komercio-API-VM
        runOptions: inline
        inline: |
          sudo systemctl stop komercio || true
          sleep 1

    - task: CopyFilesOverSSH@0
      displayName: Copiar binário para VM
      inputs:
        sshEndpoint: Komercio-API-VM
        sourceFolder: $(Pipeline.Workspace)/drop
        contents: $(OUTPUT_NAME)
        targetFolder: $(DEPLOY_PATH)
        cleanTargetFolder: false

    - task: SSH@0
      displayName: Subir serviço
      inputs:
        sshEndpoint: Komercio-API-VM
        runOptions: inline
        inline: |
          sudo chmod +x $(DEPLOY_PATH)/$(OUTPUT_NAME)
          sudo systemctl start komercio
          sleep 3
